[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sane"
version = "2.0.0"
description = "Sequential Autoencoder for Neural Embeddings"
authors = [{ name = "HSG AI:ML", email = "leo.meynent@unisg.ch" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    "torchmetrics>=1.7.3",
    "timm>=1.0.17",
    "huggingface-hub>=0.33.4",
    "transformers>=4.53.2",
    "scipy>=1.15.3",
    "ray[tune,data,default]>=2.48.0",
    "tensorboardX>=1.9",
    "hydra-core>=1.3.2",
    "scikit-learn>=1.7.2",
    "wandb>=0.23.0",
    "debugpy>=1.8.0",
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "matplotlib>=3.10.9",
    "dacite>=1.9.2",
    "insightface>=1.0.1",
]

[project.optional-dependencies]
render = [
    "accelerate",
    "diffusers",
    "peft",
    "Pillow",
]
evaluation = [
    "lpips",
    "Pillow",
    "scikit-image",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = "src"
