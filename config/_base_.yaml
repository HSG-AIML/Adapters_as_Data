log_level: "INFO"
runner: "ray"

# Global Ray Config for all experiments
num_samples: 1
num_cpus: 32               # Total number of CPUs available
num_gpus: 1                # Total number of GPUs available
cpu_per_trial: 8           # CPUs reserved per Ray trial
gpu_per_trial: 1           # GPUs reserved per Ray trial
num_checkpoints_to_keep: 3 # Number of checkpoints to keep (Ray)
ray_verbose: 3             # Ray Tune verbosity level

# Weights and Biases
wandb_project: null
wandb_group: null
wandb_api_key_file: null

hydra:
  run: {dir: .}
  output_subdir: null
  job_logging:
    version: 1
    disable_existing_loggers: false
    root: {level: ERROR}
  hydra_logging:
    version: 1
    disable_existing_loggers: false
    root: {level: ERROR}
